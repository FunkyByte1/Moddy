name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is read from package.json "packageManager" (pnpm@9.15.9); do NOT also set
      # `version:` here — action-setup@v4 errors on a mismatch (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp build version with the commit SHA
        # CalVer base from package.json (e.g. 2026.6.15) + the build SHA as semver build
        # metadata, so each nightly self-identifies in-app and in the Nexus header.
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=p.version.split('+')[0]+'+${GITHUB_SHA::7}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('Stamped version:',p.version)"

      - name: Build release zip
        run: |
          chmod +x release.sh
          ./release.sh "nightly-${GITHUB_SHA::7}"

      - name: Publish rolling nightly release
        env:
          # Same-repo releases: the built-in GITHUB_TOKEN suffices (see `permissions` above).
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG=nightly
          SHORT_SHA=${GITHUB_SHA::7}
          ZIP="releases/moddy-nightly-${SHORT_SHA}.zip"
          STABLE_ZIP="releases/moddy-nightly.zip"
          cp "$ZIP" "$STABLE_ZIP"

          # Remove the previous nightly release + tag so the new one rolls forward.
          gh release delete "$TAG" --repo "$PUBLIC_REPO" --yes --cleanup-tag || true

          # Same repo now, so pin the rolling tag to the exact build commit.
          gh release create "$TAG" "$ZIP" "$STABLE_ZIP" \
            --repo "$PUBLIC_REPO" \
            --target "$GITHUB_SHA" \
            --title "Nightly ($SHORT_SHA)" \
            --notes "Automated build from \`main\` at commit ${GITHUB_SHA}. Unstable — expect bugs." \
            --prerelease

          # Also publish an immutable per-SHA release so older nightlies stay
          # available for rollback/bisecting regressions. The rolling `nightly`
          # tag above is the install pointer; these are history only.
          SHA_TAG="nightly-${SHORT_SHA}"
          gh release create "$SHA_TAG" "$ZIP" \
            --repo "$PUBLIC_REPO" \
            --target "$GITHUB_SHA" \
            --title "Nightly ($SHORT_SHA)" \
            --notes "Automated build from \`main\` at commit ${GITHUB_SHA}. Unstable — expect bugs." \
            --prerelease || true

          # Prune per-SHA nightlies, keeping only the 30 most recent. The rolling
          # `nightly` tag is excluded by the `nightly-` prefix filter.
          gh release list --repo "$PUBLIC_REPO" --limit 200 \
            --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("nightly-"))) | sort_by(.createdAt) | reverse | .[30:] | .[].tagName' \
            | while read -r OLD_TAG; do
                [ -n "$OLD_TAG" ] || continue
                echo "Pruning old nightly: $OLD_TAG"
                gh release delete "$OLD_TAG" --repo "$PUBLIC_REPO" --yes --cleanup-tag || true
              done
