name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build release zip
        run: |
          chmod +x release.sh
          ./release.sh "nightly-${GITHUB_SHA::7}"

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=nightly
          SHORT_SHA=${GITHUB_SHA::7}
          ZIP="releases/moddy-nightly-${SHORT_SHA}.zip"

          # Remove the previous nightly release + tag so the new one rolls forward.
          gh release delete "$TAG" --yes --cleanup-tag || true

          gh release create "$TAG" "$ZIP" \
            --title "Nightly ($SHORT_SHA)" \
            --notes "Automated build from \`main\` at commit ${GITHUB_SHA}. Unstable — expect bugs." \
            --prerelease \
            --target "$GITHUB_SHA"
