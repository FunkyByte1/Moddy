name: Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build release zip
        run: |
          chmod +x release.sh
          ./release.sh "nightly-${GITHUB_SHA::7}"

      - name: Publish rolling nightly release to public repo
        env:
          # PAT with contents:write on FunkyByte1/Moddy-releases (the public repo).
          # GITHUB_TOKEN can't write cross-repo, so a fine-grained PAT is required.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PUBLIC_REPO: FunkyByte1/Moddy-releases
        run: |
          set -e
          TAG=nightly
          SHORT_SHA=${GITHUB_SHA::7}
          ZIP="releases/moddy-nightly-${SHORT_SHA}.zip"
          STABLE_ZIP="releases/moddy-nightly.zip"
          cp "$ZIP" "$STABLE_ZIP"

          # Remove the previous nightly release + tag so the new one rolls forward.
          gh release delete "$TAG" --repo "$PUBLIC_REPO" --yes --cleanup-tag || true

          # No --target: the source commit doesn't exist in the public repo, so the
          # tag is created at the public repo's default branch. The SHA is recorded
          # in the notes for traceability.
          gh release create "$TAG" "$ZIP" "$STABLE_ZIP" \
            --repo "$PUBLIC_REPO" \
            --title "Nightly ($SHORT_SHA)" \
            --notes "Automated build from \`main\` at commit ${GITHUB_SHA}. Unstable — expect bugs." \
            --prerelease

          # Also publish an immutable per-SHA release so older nightlies stay
          # available for rollback/bisecting regressions. The rolling `nightly`
          # tag above is the install pointer; these are history only.
          SHA_TAG="nightly-${SHORT_SHA}"
          gh release create "$SHA_TAG" "$ZIP" \
            --repo "$PUBLIC_REPO" \
            --title "Nightly ($SHORT_SHA)" \
            --notes "Automated build from \`main\` at commit ${GITHUB_SHA}. Unstable — expect bugs." \
            --prerelease || true

          # Prune per-SHA nightlies, keeping only the 10 most recent. The rolling
          # `nightly` tag is excluded by the `nightly-` prefix filter.
          gh release list --repo "$PUBLIC_REPO" --limit 200 \
            --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("nightly-"))) | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r OLD_TAG; do
                [ -n "$OLD_TAG" ] || continue
                echo "Pruning old nightly: $OLD_TAG"
                gh release delete "$OLD_TAG" --repo "$PUBLIC_REPO" --yes --cleanup-tag || true
              done
